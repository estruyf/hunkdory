<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#34363f"/>
      <stop offset="1" stop-color="#17181d"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.16"/>
      <stop offset="0.35" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a2c33"/>
      <stop offset="1" stop-color="#4a4d58"/>
    </linearGradient>
    <linearGradient id="cableGold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffd27a"/>
      <stop offset="1" stop-color="#e09a2c"/>
    </linearGradient>
    <linearGradient id="cableWarm" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f3a27f"/>
      <stop offset="1" stop-color="#c95f3d"/>
    </linearGradient>
    <linearGradient id="cableGreen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#9be3a5"/>
      <stop offset="1" stop-color="#3fa957"/>
    </linearGradient>
    <filter id="drop" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="14" stdDeviation="14" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
    <filter id="iconShadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <g filter="url(#iconShadow)">
    <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#body)"/>
  </g>
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#sheen)"/>
  <rect x="101.5" y="101.5" width="821" height="821" rx="183.5" fill="none" stroke="#ffffff" stroke-opacity="0.08" stroke-width="3"/>

  <g id="lines">
    <rect x="236" y="256" width="440" height="88" rx="44" fill="url(#ring)"/>
    <rect x="254" y="274" width="404" height="52" rx="26" fill="url(#cableWarm)"/>
    <rect x="276" y="282" width="150" height="10" rx="5" fill="#ffffff" fill-opacity="0.38"/>
    <rect x="236" y="392" width="552" height="88" rx="44" fill="url(#ring)"/>
    <rect x="254" y="410" width="516" height="52" rx="26" fill="url(#cableWarm)"/>
    <rect x="276" y="418" width="150" height="10" rx="5" fill="#ffffff" fill-opacity="0.38"/>
    <rect x="236" y="528" width="264" height="88" rx="44" fill="url(#ring)"/>
    <rect x="254" y="546" width="228" height="52" rx="26" fill="url(#cableGreen)"/>
    <rect x="276" y="554" width="110" height="10" rx="5" fill="#ffffff" fill-opacity="0.38"/>
  </g>

  <g filter="url(#drop)">
    <polyline points="540,690 636,786 812,566" fill="none" stroke="url(#cableGold)" stroke-width="76" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <polyline points="548,676 622,750" fill="none" stroke="#ffffff" stroke-opacity="0.38" stroke-width="14" stroke-linecap="round"/>
  <polyline points="664,742 794,580" fill="none" stroke="#ffffff" stroke-opacity="0.3" stroke-width="12" stroke-linecap="round"/>
</svg>
