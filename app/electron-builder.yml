# Packaging for macOS and Windows. Run from the repo root: npm run build:mac, or npm run build:win on Windows (see ../package.json).
appId: dev.hunkdory.app
productName: Hunkdory
copyright: Copyright © 2026 Elio Struyf

directories:
  output: dist
  buildResources: resources

# Every runtime dependency is bundled into out/ by electron-vite, so node_modules stays out of the asar.
files:
  - out/**/*
  - resources/icon.png
  - '!node_modules/**/*'

# Electron ships hundreds of locales; keep only English. A name keeps the files called that or a prefix of it: `en` is
# macOS's en.lproj (each signed separately), while Windows needs en-US.pak and en-GB.pak. Without a locale file there,
# app.getLocale() is '' and Intl throws on it (scripts/dist-win.mjs checks they are there).
electronLanguages:
  - en
  - en-US
  - en-GB

# wtv runs as `node <Resources>/tools/wtv/bin/wtv.mjs` from the agent prompts (wtvBin in src/main/index.ts).
extraResources:
  - from: ../tools/wtv
    to: tools/wtv
    filter:
      - bin/**/*
      - src/**/*
      - package.json

mac:
  icon: resources/icon.icns
  category: public.app-category.developer-tools
  target:
    - target: dmg
      arch: [arm64]
    - target: zip
      arch: [arm64]

  # Signing: electron-builder finds your "Developer ID Application" identity in the keychain on its own, or takes
  # CSC_LINK in CI. Notarisation runs when APPLE_ID, APPLE_APP_SPECIFIC_PASSWORD and APPLE_TEAM_ID are set.
  hardenedRuntime: true
  entitlements: resources/entitlements.mac.plist
  entitlementsInherit: resources/entitlements.mac.plist

  # The zip; the dmg sets its own name below.
  artifactName: ${productName}-${version}-${arch}-mac.${ext}

dmg:
  artifactName: ${productName}-${version}-${arch}.${ext}

win:
  # electron-builder makes the .ico from it.
  icon: resources/icon.png
  # One installer for both: it installs the build that matches the PC.
  target:
    - target: nsis
      arch: [x64, arm64]
  # Signing: scripts/dist-win.mjs passes Azure Trusted Signing's settings (azureSignOptions), or electron-builder takes
  # a certificate file from WIN_CSC_LINK; without either the build is unsigned (docs/development.md → Windows).

# Installs for the current user, without asking for an administrator, in %LOCALAPPDATA%\Programs\hunkdory, and the
# in-app updater installs updates the same way (latest.yml).
nsis:
  oneClick: true
  perMachine: false
  shortcutName: Hunkdory
  # No spaces: GitHub turns them into dots in release assets, and latest.yml has to name the file as uploaded.
  artifactName: ${productName}-${version}-setup.${ext}

# The update feed: packaged apps get app-update.yml pointing here, and the build writes latest-mac.yml (latest.yml on Windows).
# Nothing is uploaded by electron-builder (--publish never); the release workflow attaches the files.
publish:
  provider: github
  owner: estruyf
  repo: hunkdory
  releaseType: release
