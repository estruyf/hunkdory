# Builds Hunkdory for a GitHub release and attaches it.
#
# Runs when a release is published on GitHub (for a tag like v0.1.0):
# - mac: builds the app on an Apple Silicon runner, signs and notarises it, and checks both, giving the .dmg, the
#   .zip and what the in-app updater reads (latest-mac.yml) (arm64 only, like electron-builder.yml);
# - windows: builds the installer (x64 and Arm64 in one), signs it with Azure Trusted Signing (or a .pfx), and checks
#   it, giving the -setup.exe, its .blockmap and the update feed (latest.yml);
# - publish: only once both builds passed their checks, attaches their files to the release, the feeds last. When a
#   build fails, nothing is attached, so a release never offers one platform without the other. Re-run the failed job
#   to retry.
# - homebrew: for a release, stamps the cask with this version and pushes it to the tap.
# The version comes from the tag: the app's About panel and the file names say what the release says
# (.github/scripts/release-version.sh).
#
# Releases and pre-releases: a release (v1.2.3) must be tagged on main, and goes out to everyone: the app offers it
# through the update feeds, and Homebrew installs it. A pre-release (v0.1.0-beta.1, or any version marked as one) may
# come from any branch. It gets no feeds and no cask, so nobody is updated to it: people download it from the releases
# page.
#
# Dry run: run this workflow by hand (Actions → Release → Run workflow). Both apps are built, signed (the Mac one
# notarised) and checked, with a version like 0.1.0-dryrun.42, and kept as workflow artifacts for a week. Nothing is
# published.
#
# Adding Windows to a release that is out: run it by hand from main with "add_windows_to" set to its tag (v0.1.0). Only
# the Windows installer is built, from main as it is now, with that release's version, and attached to it with
# latest.yml (none for a pre-release). The Mac files, notes and cask stay as they are. For releases from before
# Windows was built.
#
# Nothing is ever attached unsigned: without the signing settings the run fails. See docs/development.md → Releasing.
name: Release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      add_windows_to:
        description: Tag of a published release to add the Windows installer to (v0.1.0). Empty for a dry run.
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: release-${{ github.event.release.tag_name || inputs.add_windows_to || github.ref }}
  cancel-in-progress: false

jobs:
  mac:
    name: Build, sign and notarise the Mac app
    # Not when adding Windows to a release: its Mac files are out already.
    if: ${{ !inputs.add_windows_to }}
    runs-on: macos-15
    timeout-minutes: 60
    env:
      TAG: ${{ github.event.release.tag_name }}
      DRY_RUN: ${{ github.event_name != 'release' }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name || github.ref }}

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Version from the tag
        env:
          PRERELEASE: ${{ github.event.release.prerelease }}
        run: bash .github/scripts/release-version.sh

      - name: Check a release comes from main
        if: env.DRY_RUN != 'true' && env.PRERELEASE != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.sha }}
        run: bash .github/scripts/release-from-main.sh

      # The root has no dependencies of its own; everything is in app/, and wtv has none.
      - name: Install
        run: npm ci --prefix app

      # The tests make real git repositories and commits.
      - name: Git identity for the tests
        run: |
          git config --global user.name "Hunkdory CI"
          git config --global user.email "ci@hunkdory.invalid"

      - name: Typecheck and unit tests
        run: |
          npm run typecheck
          npm test

      - name: Build, sign and notarise
        env:
          # Developer ID Application certificate and its private key, exported as .p12 and base64-encoded.
          CSC_LINK: ${{ secrets.MAC_CERTIFICATE_P12_BASE64 }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CERTIFICATE_PASSWORD }}
          # Notarisation with an app-specific password (electron-builder notarises when these are set).
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ -z "$CSC_LINK" ] || [ -z "$APPLE_ID" ] || [ -z "$APPLE_APP_SPECIFIC_PASSWORD" ] || [ -z "$APPLE_TEAM_ID" ]; then
            echo "::error::Signing secrets are missing, and nothing is attached unsigned. See docs/development.md → Releasing."
            exit 1
          fi
          # The app's version (About panel, file names) is the release's.
          (cd app && npm pkg set version="$VERSION")
          # The publish job attaches the files; electron-builder must not try to on its own when it sees a tag.
          npm --prefix app run dist:mac -- --publish never

      - name: Check the signature and notarisation
        run: |
          app=app/dist/mac-arm64/Hunkdory.app
          codesign --verify --deep --strict --verbose=2 "$app"
          xcrun stapler validate "$app"
          spctl -a -vv "$app" 2>&1 | tee spctl.txt
          grep -q "source=Notarized Developer ID" spctl.txt

      - name: Check the files
        run: |
          cd app/dist
          ls -la
          ls "Hunkdory-$VERSION-arm64.dmg" "Hunkdory-$VERSION-arm64-mac.zip" "Hunkdory-$VERSION-arm64-mac.zip.blockmap" latest-mac.yml >/dev/null
          # The feed offers this build, and the app knows where to look for the next one.
          grep -q "^version: $VERSION$" latest-mac.yml
          grep -q "Hunkdory-$VERSION-arm64-mac.zip" latest-mac.yml
          grep -q "repo: hunkdory" mac-arm64/Hunkdory.app/Contents/Resources/app-update.yml

      - name: Keep the build for the publish job
        uses: actions/upload-artifact@v7
        with:
          name: release-mac
          path: |
            app/dist/*.dmg
            app/dist/*.zip
            app/dist/*.zip.blockmap
            app/dist/latest-mac.yml
          if-no-files-found: error
          retention-days: 7

  windows:
    name: Build and sign the Windows installer
    runs-on: windows-latest
    timeout-minutes: 60
    # The Azure login has no stored secret: GitHub's OpenID Connect token is exchanged for one, and the app
    # registration's federated credential only accepts it from this environment
    # (repo:estruyf@2900833/hunkdory@1438218663:environment:windows-signing).
    environment: windows-signing
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        shell: bash
    env:
      TAG: ${{ github.event.release.tag_name || inputs.add_windows_to }}
      ADD_TO: ${{ inputs.add_windows_to }}
      DRY_RUN: ${{ github.event_name != 'release' && !inputs.add_windows_to }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name || github.ref }}

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Version from the tag
        env:
          PRERELEASE: ${{ github.event.release.prerelease }}
          GH_TOKEN: ${{ github.token }}
        run: bash .github/scripts/release-version.sh

      - name: Check a release comes from main
        if: env.DRY_RUN != 'true' && (env.PRERELEASE != 'true' || env.ADD_TO != '')
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.sha }}
        run: bash .github/scripts/release-from-main.sh

      - name: Install
        run: npm ci --prefix app

      - name: Git identity for the tests
        run: |
          git config --global user.name "Hunkdory CI"
          git config --global user.email "ci@hunkdory.invalid"

      - name: Typecheck and unit tests
        run: |
          npm run typecheck
          npm test

      - name: Azure login
        if: vars.AZURE_SIGNING_ENDPOINT != ''
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Build and sign
        env:
          # Azure Trusted Signing: the account's settings are repository variables (scripts/dist-win.mjs passes them
          # to electron-builder). Its TrustedSigning module signs with the Azure CLI login above.
          AZURE_SIGNING_ENDPOINT: ${{ vars.AZURE_SIGNING_ENDPOINT }}
          AZURE_SIGNING_ACCOUNT: ${{ vars.AZURE_SIGNING_ACCOUNT }}
          AZURE_SIGNING_PROFILE: ${{ vars.AZURE_SIGNING_PROFILE }}
          AZURE_SIGNING_PUBLISHER: ${{ vars.AZURE_SIGNING_PUBLISHER }}
          # Or a code signing certificate exported as .pfx, base64-encoded, and its password.
          WIN_CSC_LINK: ${{ secrets.WIN_CERTIFICATE_PFX_BASE64 }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CERTIFICATE_PASSWORD }}
        run: |
          if [ -n "$AZURE_SIGNING_ENDPOINT" ]; then
            echo "Signing with Azure Trusted Signing."
            unset WIN_CSC_LINK WIN_CSC_KEY_PASSWORD
          elif [ -n "$WIN_CSC_LINK" ]; then
            echo "Signing with the certificate in WIN_CERTIFICATE_PFX_BASE64."
          else
            echo "::error::Windows signing isn't set up, and nothing is attached unsigned. See docs/development.md → Releasing."
            exit 1
          fi
          # The app's version (About panel, the installer's name) is the release's.
          (cd app && npm pkg set version="$VERSION")
          npm --prefix app run dist:win -- --publish never

      - name: Check the signatures and the publisher
        # The installer and both apps are validly signed (electron-builder signs the uninstaller with the same
        # settings), by the publisher the apps check updates against: one that doesn't match would make every
        # installed copy of this release refuse all later updates.
        run: node app/scripts/checkWindowsSignatures.mjs

      - name: Check the installer can unpack everything
        # The installer skips a file it can't unpack without an error, so a broken one still reports success.
        run: node app/scripts/checkWindowsInstaller.mjs

      - name: Check the files
        run: |
          cd app/dist
          ls -la
          ls "Hunkdory-$VERSION-setup.exe" "Hunkdory-$VERSION-setup.exe.blockmap" latest.yml >/dev/null
          # The feed offers this build, and the app knows where to look for the next one.
          grep -q "^version: $VERSION$" latest.yml
          grep -q "^path: Hunkdory-$VERSION-setup.exe$" latest.yml
          grep -q "repo: hunkdory" win-unpacked/resources/app-update.yml

      - name: Keep the build for the publish job
        uses: actions/upload-artifact@v7
        with:
          name: release-windows
          path: |
            app/dist/Hunkdory-*-setup.exe
            app/dist/Hunkdory-*-setup.exe.blockmap
            app/dist/latest.yml
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Attach the builds to the release
    needs: [mac, windows]
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Only this job can write to the release; the build jobs, which run the repo's code and dependencies, can't.
    permissions:
      contents: write
    env:
      TAG: ${{ github.event.release.tag_name }}
    steps:
      # Only for CHANGELOG.md: nothing from the repo runs in this job.
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name }}
          persist-credentials: false

      - name: Download the builds
        uses: actions/download-artifact@v7
        with:
          pattern: release-*
          path: dist
          merge-multiple: true

      - name: Attach them to the release
        env:
          GH_TOKEN: ${{ github.token }}
          PRERELEASE: ${{ github.event.release.prerelease }}
        run: |
          cd dist
          ls -la
          gh release upload "$TAG" *.dmg *.zip *.zip.blockmap *-setup.exe *-setup.exe.blockmap --clobber --repo "$GITHUB_REPOSITORY"
          # The feeds last, so they never point at a file that isn't there yet. A pre-release gets none: the app only
          # follows releases.
          if [ "$PRERELEASE" != "true" ]; then
            gh release upload "$TAG" latest-mac.yml latest.yml --clobber --repo "$GITHUB_REPOSITORY"
          fi

      - name: Fill in empty release notes from the changelog
        env:
          GH_TOKEN: ${{ github.token }}
          BODY: ${{ github.event.release.body }}
          PRERELEASE: ${{ github.event.release.prerelease }}
        run: |
          if [ -n "$(echo "$BODY" | tr -d '[:space:]')" ]; then
            echo "The release has notes; leaving them."
            exit 0
          fi
          # A section of CHANGELOG.md, without the link definitions.
          section() {
            awk -v v="$1" '
              index($0, "## [" v "]") == 1 { on = 1; next }
              on && /^## \[/ { exit }
              on && !/^\[[^]]+\]: / { print }
            ' CHANGELOG.md
          }
          # An empty section is still blank lines, so look for text.
          has_text() { grep -q '[^[:space:]]' notes.md; }
          section "${TAG#v}" > notes.md
          # The changelog only lists releases, so a pre-release gets what is in Unreleased.
          if ! has_text && [ "$PRERELEASE" == "true" ]; then
            section Unreleased > notes.md
          fi
          if ! has_text; then
            echo "::warning::CHANGELOG.md has nothing for $TAG, so the release has GitHub's generated notes. Edit them, and add the section to the changelog."
            gh api "repos/$GITHUB_REPOSITORY/releases/generate-notes" -f tag_name="$TAG" --jq .body > notes.md
          fi
          gh release edit "$TAG" --notes-file notes.md --repo "$GITHUB_REPOSITORY"

  # Adding Windows to a release that is out (the add_windows_to input): only its files, its feed last.
  add-windows:
    name: Attach the Windows installer to ${{ inputs.add_windows_to }}
    needs: [windows]
    if: github.event_name == 'workflow_dispatch' && inputs.add_windows_to != ''
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    env:
      TAG: ${{ inputs.add_windows_to }}
    steps:
      - name: Download the build
        uses: actions/download-artifact@v7
        with:
          name: release-windows
          path: dist

      - name: Attach it to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd dist
          ls -la
          gh release upload "$TAG" *-setup.exe *-setup.exe.blockmap --clobber --repo "$GITHUB_REPOSITORY"
          # A pre-release gets no feed: the app only follows releases.
          if [ "$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isPrerelease --jq .isPrerelease)" != "true" ]; then
            gh release upload "$TAG" latest.yml --clobber --repo "$GITHUB_REPOSITORY"
          fi

  # What makes `brew install --cask estruyf/tap/hunkdory` resolve. Its own job, so a tap failure can be re-run without
  # touching the release, and the token never sits next to the one that can write to it. Only releases: a cask carries
  # one version, and it should be the one releases/latest returns.
  homebrew:
    name: Update the Homebrew tap
    needs: [publish]
    if: github.event_name == 'release' && !github.event.release.prerelease
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TAG: ${{ github.event.release.tag_name }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name }}

      # The exact bytes attached to the release, so hashing them can't race the CDN.
      - name: Download the build
        uses: actions/download-artifact@v7
        with:
          name: release-mac
          path: app/dist

      - name: Stamp the cask and push it to the tap
        env:
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          if [ -z "$HOMEBREW_TAP_TOKEN" ]; then
            echo "::warning::HOMEBREW_TAP_TOKEN is not set, so the tap still serves the previous version. Run homebrew/publish-cask.sh --push by hand (docs/development.md → Homebrew)."
            exit 0
          fi
          VERSION="${TAG#v}" ./homebrew/publish-cask.sh --push
